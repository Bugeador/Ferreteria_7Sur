<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barraca 7 Sur - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="split-container">
    
    <!-- Lado Izquierdo: Login -->
    <main class="form-section">
      <div class="form-box">
        
        <!-- Logo centrado -->
        <div class="logo-container">
          <img src="imagenes/barraca2.png" alt="Barraca de Fierros 7 Sur">
        </div>

        <!-- Encabezado -->
        <div class="form-header">
          <h1>Iniciar Sesión</h1>
          <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>

        <!-- Formulario -->
        <form id="formLogin">
          <div class="form-group">
            <label for="usuario">Correo o Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="ejemplo@correo.com" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="form-options">
            <label>
              <input type="checkbox" name="recordar"> Recordarme
            </label>
          </div>

          <button type="submit" class="btn-submit">Ingresar</button>

          <div class="form-footer">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
        </form>

        <div class="legal-footer">
          <p>© 2026 Barraca de Fierros 7 Sur. Todos los derechos reservados.</p>
        </div>

      </div>
    </main>

    <!-- Lado Derecho: Imagen del Cohete -->
    <aside class="hero-section" aria-label="Ilustración"></aside>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
